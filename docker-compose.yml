services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 3s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 15

  api:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    volumes:
      - ./backend-java:/app
      - maven_cache:/root/.m2
    ports:
      - "3001:3001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      JWT_SECRET: ${JWT_SECRET}
      PROVIDER_CONFIG_SECRET: ${PROVIDER_CONFIG_SECRET}
      APP_KEY_PEPPER: ${APP_KEY_PEPPER}
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3001/health/live | grep '\"ok\":true'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 240s
    command: >
      bash -lc "mvn spring-boot:run"

  web:
    image: node:20-bookworm
    working_dir: /project/client
    volumes:
      - .:/project
      - web_client_node_modules:/project/client/node_modules
    ports:
      - "5174:5174"
    environment:
      API_PROXY_TARGET: http://api:3001
      # 告诉 Vite：当前是 compose 的 web 服务，代理可解析主机名 api
      VITE_DOCKER_COMPOSE_WEB: "1"
    depends_on:
      api:
        condition: service_healthy
    command: >
      bash -lc "npm install &&
      npm run dev -- --host 0.0.0.0 --port 5174"

volumes:
  crm_pg_data:
  maven_cache:
  web_client_node_modules:
