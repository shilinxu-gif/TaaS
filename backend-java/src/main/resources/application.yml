server:
  port: ${PORT:3001}

spring:
  application:
    name: taas-backend-java
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:crm}
    username: ${POSTGRES_USER:crm}
    password: ${POSTGRES_PASSWORD:crm}
    driver-class-name: org.postgresql.Driver
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 20260415090000
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

taas:
  gateway:
    # 无 Idempotency-Key 时是否启用「请求体指纹」缓存（仅非流式 chat/completions）；设为 false 则仅幂等键可命中缓存。
    body-fingerprint-cache-enabled: ${TAAS_GATEWAY_BODY_FINGERPRINT_CACHE:true}
    # 临时排障：true 时 GatewayController 以 WARN 打印 JSON 请求/响应体（截断）；SSE 仅打印响应流开头一段。勿长期开启。
    debug-log-http-bodies: ${TAAS_GATEWAY_DEBUG_LOG_HTTP_BODIES:false}
    debug-log-max-chars: ${TAAS_GATEWAY_DEBUG_LOG_MAX_CHARS:24000}
    debug-log-sse-head-max-chars: ${TAAS_GATEWAY_DEBUG_LOG_SSE_HEAD_MAX_CHARS:16384}
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: taas-java
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
  security:
    provider-config-secret: ${PROVIDER_CONFIG_SECRET:}
    app-key-pepper: ${APP_KEY_PEPPER:}
  bootstrap:
    admin-login: ${BOOTSTRAP_ADMIN_LOGIN:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  commercial:
    sales-email: ${SALES_EMAIL:sales@taas.example}
    support-email: ${SUPPORT_EMAIL:support@taas.example}
    trial-days: ${TRIAL_DAYS:14}
    allow-mock-provider: ${ALLOW_MOCK_PROVIDER:false}
  providers:
    openai-api-key: ${OPENAI_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    google-api-key: ${GOOGLE_API_KEY:}
